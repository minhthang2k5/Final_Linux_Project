# N4: /etc/postgresql/<ver>/main/pg_hba.conf
# Đọc từ trên xuống, dòng đầu tiên khớp sẽ quyết định. Không khớp dòng nào => bị từ chối.
#
# TYPE  DATABASE  USER      ADDRESS        METHOD

# Quản trị: chỉ user hệ thống "postgres" (sudo -u postgres psql), xác thực bằng peer (tên user Linux).
local   all       postgres                 peer

# App: appuser chỉ được vào appdb, phải có mật khẩu (SCRAM), chỉ từ chính máy này.
local   appdb     appuser                  scram-sha-256
host    appdb     appuser   127.0.0.1/32   scram-sha-256
host    appdb     appuser   ::1/128        scram-sha-256

# Mọi thứ khác (user khác, DB khác, IP khác) đều bị từ chối tường minh.
local   all       all                      reject
host    all       all       0.0.0.0/0      reject
host    all       all       ::/0           reject
