# N4: cấu hình PostgreSQL cho lab, đặt vào /etc/postgresql/<ver>/main/conf.d/99-lab.conf
# (postgresql.conf của Ubuntu đã có include_dir = 'conf.d', file này được nạp sau cùng).

# Chỉ nghe loopback: app chạy cùng máy, không ai từ mạng ngoài chạm được cổng 5432.
# Kiểm tra: ss -tlnp | grep 5432  -> chỉ thấy 127.0.0.1:5432 (và [::1]:5432)
listen_addresses = 'localhost'
port = 5432

# Băm mật khẩu bằng SCRAM thay vì md5 (md5 đã yếu).
password_encryption = scram-sha-256

# Ghi lại kết nối để có dấu vết khi vấn đáp / điều tra.
log_connections = on
log_disconnections = on
